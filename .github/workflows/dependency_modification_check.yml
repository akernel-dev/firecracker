name: Check dependency changes

on: pull_request


permissions:
  contents: read

jobs:
  dependency_changed_check:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: "Test dependency policy"
        run: python3 resources/akernel/check-dependency-changes_test.py

      - name: "Check Cargo.lock changes against upstream"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 resources/akernel/check-dependency-changes.py "${BASE_SHA}"
